seoTitle: Sobre mí — Desarrollo independiente | Mizradev
seoDescription: >-
  Conoce mi forma de trabajar: comunicación directa, diseño con propósito y
  desarrollo freelance atento a cada detalle.
intro:
  eyebrow: Sobre mí
  title: Detrás de cada gran idea, una conexión humana.
  text: >-
    Soy Mizradev, desarrollador freelance. Combino diseño, código y estrategia
    para convertir retos de negocio en experiencias digitales simples y
    cuidadas.
  action: Conozcamos tu idea
  href: /agendar-llamada
banner:
  image: /assets/banner/image.png
  imageAlt: Espacio de trabajo con un portátil, plantas y luz natural
  eyebrow: MI FORMA DE TRABAJAR
  heading: |-
    Cerca de tu idea.
    Atento a cada detalle.
values:
  eyebrow: LO QUE GUÍA MI TRABAJO
  heading: |-
    Buenas soluciones.
    Principios claros.
  text: La experiencia de trabajar juntos importa tanto como el resultado final.
  items:
    - name: Trato directo
      description: >-
        Hablas con la persona que diseña y desarrolla tu proyecto. Tus preguntas
        e ideas llegan directamente a quien las convierte en una solución.
    - name: Claridad en cada paso
      description: >-
        Definimos prioridades, revisamos avances y tomamos decisiones juntos.
        Siempre tendrás contexto para entender qué estamos construyendo.
    - name: Diseño con propósito
      description: >-
        Cada pantalla tiene una razón de ser. Busco que tu proyecto se sienta
        bien, sea fácil de usar y responda a una necesidad de tu negocio.
note:
  eyebrow: DESARROLLO INDEPENDIENTE
  heading: Tu proyecto no necesita ser enorme para merecer toda mi atención.
  text: >-
    Me interesa entender cómo funciona tu negocio, qué necesitan tus usuarios y
    dónde puede ayudar la tecnología. A partir de ahí, damos forma a una
    solución que tenga sentido para ti.
  cta:
    text: Explora mis servicios
    href: /services
