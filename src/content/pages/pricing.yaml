faq:
  heading: Buenas preguntas. Respuestas claras.
  items:
    - title: ¿Qué necesitas para empezar?
      answer: Cuéntame qué hace tu negocio, qué quieres lograr y si ya tienes una web. Si cuentas con textos, imágenes o una identidad visual, también nos servirán para definir el punto de partida.
    - title: ¿Cuánto cuesta un proyecto?
      answer: Depende del alcance, las funciones y los contenidos. Primero revisamos tu idea y después preparo una propuesta con entregables y presupuesto para que puedas decidir con claridad.
    - title: ¿Cuánto tiempo tomará?
      answer: Lo definimos al conocer el alcance y la disponibilidad de contenidos. Acordamos las etapas, las revisiones y una fecha de entrega antes de comenzar.
    - title: ¿Con quién voy a trabajar?
      answer: Directamente conmigo. Soy desarrollador freelance y estaré en contacto contigo para revisar la propuesta, compartir avances y resolver dudas durante el proyecto.
    - title: ¿Puedo mejorar una web que ya existe?
      answer: Sí. Podemos revisar su diseño, rendimiento y estructura para decidir qué conviene conservar, mejorar o reconstruir según tus objetivos.
    - title: ¿Qué pasa después del lanzamiento?
      answer: Te orientaré para gestionar tu proyecto. Si necesitas mantenimiento o nuevas funciones, podemos definir juntos el alcance de esa siguiente etapa.
  eyebrow: ANTES DE EMPEZAR
  text: Lo esencial para dar el siguiente paso con confianza.
  cta:
    text: Cuéntame tu idea
    href: /contact
