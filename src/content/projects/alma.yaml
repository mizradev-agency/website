name: Alma
title: Una tienda con identidad
category: Web
discipline: E-commerce · Diseño web
visual: commerce
summary: Una experiencia de compra que conecta producto, marca y personas.
challenge: Imaginar una tienda de objetos para el hogar que transmita calma y deje que los productos sean los protagonistas, sin complicar la navegación.
approach: Una dirección visual cálida, jerarquías claras y un recorrido sencillo desde la colección hasta el producto. El diseño combina espacio en blanco, tipografía editorial y tonos naturales.
outcome: Una propuesta de interfaz para explorar cómo una tienda puede expresar su identidad y facilitar el descubrimiento de productos. Es un concepto visual, sin ventas ni resultados comerciales medidos.
scope:
  - Dirección visual
  - Diseño de tienda
  - Navegación
  - Experiencia responsive
order: 1
