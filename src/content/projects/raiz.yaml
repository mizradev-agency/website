name: Raíz
title: Contenido con espacio para crecer
category: Web
discipline: Web editorial · Estructura SEO
visual: editorial-concept
summary: Una publicación digital donde leer, descubrir y encontrar es sencillo.
challenge: Plantear una web editorial que organice temas y artículos de forma comprensible, con una identidad propia y una lectura agradable.
approach: Categorías reconocibles, títulos descriptivos y una estructura que conecta la portada con el contenido. El sistema visual da prioridad a la legibilidad y al descubrimiento de nuevas lecturas.
outcome: Un concepto de publicación digital para ilustrar la relación entre contenido, diseño y estructura. No se atribuyen mejoras de tráfico ni posicionamiento sin datos reales.
scope:
  - Diseño editorial
  - Estructura de contenido
  - Arquitectura SEO
  - Experiencia de lectura
