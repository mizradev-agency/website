name: Ritmo
title: Pequeños pasos, todos los días
category: Apps
discipline: Aplicación móvil · UI/UX
visual: mobile-concept
summary: Una app conceptual para organizar hábitos con una experiencia amable.
challenge: Explorar cómo ayudar a una persona a centrarse en sus hábitos del día sin convertir la experiencia en una lista interminable de tareas.
approach: Una pantalla principal con una prioridad clara, progreso visible y acciones breves. Los colores suaves y la jerarquía visual mantienen la información fácil de recorrer.
outcome: Una exploración de interfaz móvil y seguimiento de hábitos. La pantalla es un prototipo visual; no representa una aplicación publicada ni resultados de usuarios.
scope:
  - Diseño móvil
  - Flujos de usuario
  - Seguimiento de hábitos
  - Prototipo visual
order: 3
